services:
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_VERSION:?required}
    container_name: vaultwarden
    restart: unless-stopped
    env_file: .env
    environment:
      DOMAIN: https://${VAULTWARDEN_SERVER_HOSTNAME:?required}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-false}
      SIGNUPS_DOMAINS_WHITELIST: ${SIGNUPS_DOMAINS_WHITELIST}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Vaultwarden}
    volumes:
      - ./.docker/vaultwarden/data:/data
    networks:
      - traefik-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network

      # Ana uygulama
      - traefik.http.routers.vaultwarden.rule=Host(`${VAULTWARDEN_SERVER_HOSTNAME:?required}`)
      - traefik.http.routers.vaultwarden.entrypoints=https
      - traefik.http.routers.vaultwarden.tls.certresolver=cloudflare
      - traefik.http.routers.vaultwarden.service=vaultwarden

      # Admin panel — IP kısıtlamalı
      - traefik.http.routers.vaultwarden-admin.rule=Host(`${VAULTWARDEN_SERVER_HOSTNAME:?required}`) && PathPrefix(`/admin`)
      - traefik.http.routers.vaultwarden-admin.entrypoints=https
      - traefik.http.routers.vaultwarden-admin.tls.certresolver=cloudflare
      - traefik.http.routers.vaultwarden-admin.middlewares=trusted@file
      - traefik.http.routers.vaultwarden-admin.service=vaultwarden

      - traefik.http.services.vaultwarden.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


networks:
  traefik-network:
    external: true
